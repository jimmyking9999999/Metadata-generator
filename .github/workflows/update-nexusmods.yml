name: Update Nexus Mods Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nexusmods
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Download Mono.Cecil
        shell: pwsh
        run: |
          $packageVersion = "0.11.6"
          $packageUrl = "https://www.nuget.org/api/v2/package/Mono.Cecil/$packageVersion"
          $packagePath = Join-Path $env:RUNNER_TEMP "Mono.Cecil.$packageVersion.nupkg"
          $extractPath = Join-Path $env:RUNNER_TEMP "mono-cecil"

          Invoke-WebRequest -Uri $packageUrl -OutFile $packagePath
          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }

          Expand-Archive -LiteralPath $packagePath -DestinationPath $extractPath
          $cecilDll = Join-Path $extractPath "lib\net40\Mono.Cecil.dll"
          if (-not (Test-Path $cecilDll)) {
            throw "Mono.Cecil.dll not found at $cecilDll"
          }

          "MONO_CECIL_DLL_PATH=$cecilDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Full refresh Nexus metadata and badges
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          MONO_CECIL_DLL_PATH: ${{ env.MONO_CECIL_DLL_PATH }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          DISCORD_WEBHOOK_URL_3: ${{ secrets.DISCORD_WEBHOOK_URL_3 }}
          DISCORD_WEBHOOK_URL_4: ${{ secrets.DISCORD_WEBHOOK_URL_4 }}
          DISCORD_WEBHOOK_URL_5: ${{ secrets.DISCORD_WEBHOOK_URL_5 }}
          DISCORD_WEBHOOK_URL_6: ${{ secrets.DISCORD_WEBHOOK_URL_6 }}
          DISCORD_WEBHOOK_URL_7: ${{ secrets.DISCORD_WEBHOOK_URL_7 }}
          DISCORD_WEBHOOK_URL_8: ${{ secrets.DISCORD_WEBHOOK_URL_8 }}
          DISCORD_WEBHOOK_URL_9: ${{ secrets.DISCORD_WEBHOOK_URL_9 }}
          DISCORD_WEBHOOK_URL_10: ${{ secrets.DISCORD_WEBHOOK_URL_10 }}
          DISCORD_WEBHOOK_URL_NSFW: ${{ secrets.DISCORD_WEBHOOK_URL_NSFW }}
          DISCORD_WEBHOOK_URL_NSFW_2: ${{ secrets.DISCORD_WEBHOOK_URL_NSFW_2 }}
          DISCORD_WEBHOOK_URL_NSFW_3: ${{ secrets.DISCORD_WEBHOOK_URL_NSFW_3 }}
          DISCORD_WEBHOOK_URL_NSFW_4: ${{ secrets.DISCORD_WEBHOOK_URL_NSFW_4 }}
          DISCORD_WEBHOOK_URL_NSFW_5: ${{ secrets.DISCORD_WEBHOOK_URL_NSFW_5 }}
          DISCORD_WEBHOOK_URL_NSFW_6: ${{ secrets.DISCORD_WEBHOOK_URL_NSFW_6 }}
          DISCORD_WEBHOOK_URL_NSFW_7: ${{ secrets.DISCORD_WEBHOOK_URL_NSFW_7 }}
          DISCORD_WEBHOOK_URL_NSFW_8: ${{ secrets.DISCORD_WEBHOOK_URL_NSFW_8 }}
          DISCORD_WEBHOOK_URL_NSFW_9: ${{ secrets.DISCORD_WEBHOOK_URL_NSFW_9 }}
          DISCORD_WEBHOOK_URL_NSFW_10: ${{ secrets.DISCORD_WEBHOOK_URL_NSFW_10 }}
          DISCORD_WEBHOOK_URL_RELEASES: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES }}
          DISCORD_WEBHOOK_URL_RELEASES_2: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES_2 }}
          DISCORD_WEBHOOK_URL_RELEASES_3: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES_3 }}
          DISCORD_WEBHOOK_URL_RELEASES_4: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES_4 }}
          DISCORD_WEBHOOK_URL_RELEASES_5: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES_5 }}
          DISCORD_WEBHOOK_URL_RELEASES_6: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES_6 }}
          DISCORD_WEBHOOK_URL_RELEASES_7: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES_7 }}
          DISCORD_WEBHOOK_URL_RELEASES_8: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES_8 }}
          DISCORD_WEBHOOK_URL_RELEASES_9: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES_9 }}
          DISCORD_WEBHOOK_URL_RELEASES_10: ${{ secrets.DISCORD_WEBHOOK_URL_RELEASES_10 }}
        run: npm run update:nexusmods:full -- --skip-large-archives

      - name: Commit and push changes
        run: |
          $changes = git status --porcelain -- nexusmods.json thunderstore.json nexusmods-versions.json badges
          if (-not $changes) {
            Write-Host "No Nexus metadata or badge changes detected."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexusmods.json thunderstore.json nexusmods-versions.json badges
          git commit -m "Update Nexus metadata"
          git pull --rebase -X theirs
          git push
